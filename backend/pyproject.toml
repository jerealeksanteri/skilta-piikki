[project]
name = "skilta-piikki-backend"
# Releases are versioned by git tags (vX.Y.Z), not here.
version = "0.0.0"
description = "SkiltaPiikki backend: FastAPI app for the Telegram Mini App"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.10",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "alembic==1.18.3",
    "httpx==0.28.1",
    "APScheduler==3.10.4",
    "starlette>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.2",
]

[tool.uv]
# An application, not a library: install dependencies only.
package = false

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is left to the formatter
    "E712",  # `== True` is the SQLAlchemy idiom in filters
    "B008",  # FastAPI declares dependencies as defaults: Depends(...)
]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are generated and kept as written.
"alembic/versions/*" = ["E", "W", "UP", "I"]
