name: Release

# Runs when a version tag is pushed, e.g. with `scripts/release.sh minor`
# or `git tag v2.4.0 && git push origin v2.4.0`.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails before anything is built if the tag skips a version or isn't on main.
      - name: Check tag and write release notes
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/release_notes.py "$TAG" \
            --repo "${{ github.repository }}" \
            --image-prefix "$IMAGE_PREFIX" \
            --out "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          BUMP: ${{ steps.version.outputs.bump }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG ($BUMP)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
