# Local development: PostgreSQL, the backend with auto-reload and the Vite
# dev server with hot reload.
#
#   docker compose up --build
#   docker compose exec backend python -m app.dev_seed   # optional sample data
#
# App http://localhost:5173 · API http://localhost:8000/docs · DB localhost:5432
# Production runs on k3s from the server-config repo, not from this file.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: piikki
      POSTGRES_PASSWORD: piikki
      POSTGRES_DB: piikki
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piikki -d piikki"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://piikki:piikki@db:5432/piikki
      # Skips Telegram login (you are "Dev User", an admin) and only logs bot messages.
      DEV_MODE: "true"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules separate from the host's.
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pg-data:
  frontend-node-modules:
