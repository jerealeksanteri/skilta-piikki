[project]
name = "skilta-piikki-backend"
# Releases are versioned by git tags (vX.Y.Z), not here.
version = "0.0.0"
description = "SkiltaPiikki backend: FastAPI app for the Telegram Mini App"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.10",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "alembic==1.18.3",
    "httpx==0.28.1",
    "APScheduler==3.10.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
# An application, not a library: install dependencies only.
package = false
